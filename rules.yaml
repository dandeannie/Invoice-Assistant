default:
  required:
  - invoice_date
  require_any:
  - - invoice_number
    - bill_number
    - order_number
    - receipt_number
  require_bill_from: true
  require_bill_to: false
  require_tax_id: false
  require_regulatory: false
  require_line_fields:
  - description
  require_tax_breakup: false
  require_subtotal: false
  require_total: true
  regex: {}
  max_total: null
  min_total: null
  date_not_future: true
  date_max_age_days: null
  allowed_tax_rates: null
  require_line_items: true
